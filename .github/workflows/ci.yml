name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-flight runs for the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Lint — Biome static analysis on all TS/TSX/JS/JSON source.
  # Runs once (not in the matrix) because it is fast and OS-independent.
  # ---------------------------------------------------------------------
  lint:
    name: lint (biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # version comes from package.json "packageManager" (do not also set version:)
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (errors only — CI gate)
        # --diagnostic-level=error makes warnings non-fatal; only emitted
        # errors fail the step. This lets us introduce lint incrementally
        # without a big-bang cleanup commit.
        run: pnpm exec biome lint --diagnostic-level=error packages/ apps/

  # ---------------------------------------------------------------------
  # Build + typecheck + test across the OS × Node matrix.
  # ---------------------------------------------------------------------
  build-and-test:
    name: typecheck + build + test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "22"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workspace packages export types from dist/; typecheck needs a prior build
      # on a clean runner (local trees often already have dist/ from `pnpm build`).
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        # --no-bail: finish every package so the log shows all failures, not just the first.
        # Explicit bash: Windows runners default to pwsh, which rejects `set -o pipefail`.
        shell: bash
        run: |
          set -o pipefail
          pnpm -r --no-bail test 2>&1 | tee test-output.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log-${{ matrix.os }}-node${{ matrix.node }}
          path: test-output.log
          retention-days: 5

      - name: Summarize test failures
        if: failure()
        shell: bash
        run: |
          {
            echo "## Test failures (${{ matrix.os }} / node ${{ matrix.node }})"
            echo '```'
            grep -E 'FAIL |AssertionError|ELIFECYCLE|Test Files.*failed|ERR_PNPM' test-output.log | head -100 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Coverage — v8 coverage for the core package (and others, if they have
  # tests). Reports are uploaded as artifacts and, on the core package,
  # thresholds are enforced (core ≥80%).
  # ---------------------------------------------------------------------
  coverage:
    name: test coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests with coverage
        # Gate on core only — other packages still sit below their historical
        # 60% thresholds (CLI/UI surface area). Raise the filter as coverage grows.
        run: |
          set -o pipefail
          pnpm --filter @codepilot/core test:coverage 2>&1 | tee coverage-output.log

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
            apps/*/coverage/
            coverage-output.log
          retention-days: 14

      - name: Summarize coverage failure
        if: failure()
        run: |
          {
            echo "## Coverage failure"
            echo '```'
            grep -E 'ERROR:|ELIFECYCLE|FAIL |Test Files' coverage-output.log | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # IDEA plugin — Gradle compile + Kotlin unit tests on Linux with JDK 17.
  # Uses the setup-gradle action for caching. This is the CI integration
  # Coverage gate for @codepilot/core.
  # ---------------------------------------------------------------------
  idea-build:
    name: IDEA plugin (Gradle build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only cache the wrapper + deps; build outputs are per-run.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Compile Kotlin
        working-directory: apps/idea
        run: ./gradlew compileKotlin --no-daemon

      - name: Run unit tests
        working-directory: apps/idea
        run: |
          set +e
          ./gradlew test --no-daemon --continue
          code=$?
          echo "::group::IDEA test XML"
          find build/test-results -name '*.xml' -print -exec cat {} \; 2>/dev/null || true
          echo "::endgroup::"
          exit $code

      - name: Upload IDEA test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: idea-test-reports
          path: |
            apps/idea/build/reports/tests/
            apps/idea/build/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Build plugin (verify packaging)
        working-directory: apps/idea
        # Uses webview stub when apps/web/dist-embed is absent (see build.gradle.kts).
        run: ./gradlew buildPlugin --no-daemon

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepilot-idea-plugin
          path: apps/idea/build/distributions/*.zip
          if-no-files-found: warn
          retention-days: 14
