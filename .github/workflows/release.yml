name: Release

# Triggered by pushing a tag matching `v*.*.*` (e.g. v2.0.1, v3.0.0).
# Builds and publishes:
#   - @codepilot/core, @codepilot/protocol, @codepilot/tui → npm (public)
#   - codepilot + codepilot-tui binaries (6 targets, built per-OS/arch)
#     + web SPA tarballs — @yao-pkg/pkg only builds for its host platform
#   - codepilot-vscode → GitHub Release as .vsix
#   - CodePilot IDEA plugin → GitHub Release as .zip
#   - Desktop app (.dmg / .exe / .AppImage)
# The CLI/TUI binaries are what scripts/install.{sh,ps1} download — no Node
# needed at runtime. A GitHub Release is created automatically
# (softprops/action-gh-release) and all artifacts are attached to it.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------
  # Build everything from a single job so the artifacts share a cache.
  # ---------------------------------------------------------------------
  build:
    name: Build all artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Setup JDK 17 (for IDEA plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all TS packages
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        id: test
        run: pnpm test 2>&1 | tee /tmp/test.log

      - name: Test diagnostics
        if: always() && steps.test.outcome != 'skipped'
        run: |
          {
            echo "## Test output (tail)"
            echo '```'
            tail -150 /tmp/test.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # --- npm packages (tarballs) ---
      - name: Pack npm packages
        run: pnpm package:npm

      - name: Collect npm tarballs
        run: |
          mkdir -p artifacts/npm
          find packages apps/tui -name "*.tgz" -exec cp {} artifacts/npm/ \;
          ls -la artifacts/npm/

      # --- VSCode extension (.vsix) ---
      - name: Package VSCode extension
        run: pnpm package:vscode

      - name: Collect .vsix
        run: |
          mkdir -p artifacts/vscode
          find apps/vscode -name "*.vsix" -exec cp {} artifacts/vscode/ \;
          ls -la artifacts/vscode/

      # --- IDEA plugin (.zip) ---
      - name: Build IDEA plugin
        working-directory: apps/idea
        run: ./gradlew buildPlugin --no-daemon

      - name: Collect IDEA .zip
        run: |
          mkdir -p artifacts/idea
          find apps/idea/build/distributions -name "*.zip" -exec cp {} artifacts/idea/ \;
          ls -la artifacts/idea/

      - name: Collect install scripts
        run: |
          mkdir -p artifacts/install
          cp scripts/install.sh  artifacts/install/install.sh
          cp scripts/install.ps1 artifacts/install/install.ps1
          cp scripts/install.cmd artifacts/install/install.cmd
          ls -la artifacts/install/

      # --- Upload all as workflow artifacts for downstream jobs ---
      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: artifacts/npm/*.tgz

      - name: Upload VSCode vsix
        uses: actions/upload-artifact@v4
        with:
          name: vscode-vsix
          path: artifacts/vscode/*.vsix

      - name: Upload IDEA plugin
        uses: actions/upload-artifact@v4
        with:
          name: idea-plugin
          path: artifacts/idea/*.zip

      - name: Upload install scripts
        uses: actions/upload-artifact@v4
        with:
          name: install-script
          path: artifacts/install/*

# ---------------------------------------------------------------------
# Desktop (Electron) app — cross-platform. electron-builder can only
# produce a platform's installer on that platform's host, so a matrix
# builds macOS (.dmg), Windows (.exe), and Linux (.AppImage), each for
# x64 + arm64.
# ---------------------------------------------------------------------
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            family: mac
          - os: windows-latest
            family: win
          - os: ubuntu-latest
            family: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ matrix.family }}" = "win" ]; then
            pnpm install --frozen-lockfile --ignore-scripts 2>&1 | tee /tmp/install.log
            pnpm rebuild electron 2>&1 | tee -a /tmp/install.log
          else
            pnpm install --frozen-lockfile 2>&1 | tee /tmp/install.log
          fi

      - name: Install diagnostics
        if: always()
        shell: bash
        run: |
          {
            echo "## Install log (tail)"
            echo '```'
            tail -100 /tmp/install.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package desktop app
        run: pnpm package:desktop

      - name: Collect desktop artifacts
        shell: bash
        run: |
          mkdir -p artifacts/desktop
          find dist/release/desktop -maxdepth 1 -type f \( \
            -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \
          \) -exec cp {} artifacts/desktop/ \;
          ls -la artifacts/desktop/

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.family }}
          path: artifacts/desktop/*

# ---------------------------------------------------------------------
# CLI + TUI binaries (self-contained — no Node needed at runtime). These
# are what scripts/install.{sh,ps1} download. Both are built per-OS/arch on
# arch-native runners:
#   - CLI: esbuild→CJS→@yao-pkg/pkg, which only builds for its host platform.
#   - TUI: Bun --compile (ESM + top-level await + native addons). Bun can
#     cross-compile, but embeds host-arch native addons, so we build on the
#     native runner for a correct better-sqlite3 (the session index).
# Each runner also emits the shared web SPA tarball (codepilot-web-<target>.tar.gz)
# via package:cli; they are identical across targets, one per target is shipped.
# ---------------------------------------------------------------------
  binaries:
    name: Binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest        # arm64
            target: darwin-arm64
          - os: macos-13            # x64
            target: darwin-x64
          - os: ubuntu-latest       # x64
            target: linux-x64
          - os: ubuntu-24.04-arm    # arm64
            target: linux-arm64
          - os: windows-latest      # x64
            target: win-x64
          - os: windows-11-arm      # arm64
            target: win-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Bun (for the TUI binary)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        shell: bash
        # Windows: node-pty install script can fail on CI runners. Use
        # --ignore-scripts to skip native compilation, then rebuild only the
        # packages that have prebuilds or need compilation for this host.
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            pnpm install --frozen-lockfile --ignore-scripts
            pnpm rebuild node-pty
          else
            pnpm install --frozen-lockfile
          fi

      # @yao-pkg/pkg downloads a ~40 MB pre-built Node.js binary on first run.
      # Cache it so subsequent runs don't re-download (and potentially stall).
      - name: Cache pkg Node binaries
        uses: actions/cache@v4
        with:
          path: ~/.pkg-cache
          key: pkg-cache-${{ matrix.target }}-${{ runner.os }}-v3.6

      # No PACKAGE_TARGETS → currentPlatform() → this runner's own OS+arch,
      # so pkg produces exactly matrix.target. package:cli also writes the
      # web SPA tarball for this target.
      - name: Package CLI binary (+ web tarball)
        run: pnpm package:cli

      # package:tui uses Bun --compile; no PACKAGE_TARGETS → host target.
      - name: Package TUI binary
        run: pnpm package:tui

      - name: Collect binaries + web tarball
        shell: bash
        run: |
          mkdir -p artifacts/bin
          find dist/release/cli -maxdepth 1 -type f \( \
            -name "codepilot-darwin-*" -o -name "codepilot-linux-*" \
            -o -name "codepilot-win-*" -o -name "codepilot-web-*.tar.gz" \
          \) ! -name "*.tgz" -exec cp {} artifacts/bin/ \;
          find dist/release/tui -maxdepth 1 -type f -name "codepilot-tui-*" \
            ! -name "*.tgz" -exec cp {} artifacts/bin/ \;
          ls -la artifacts/bin/

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: artifacts/bin/*

# ---------------------------------------------------------------------
# Publish to npm. Separate job so a publish failure doesn't block the
# GitHub Release. Each package is published with `--access public` and
# `--no-git-checks` (the tag checkout is detached, not on a branch).
# ---------------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Download npm tarballs
        uses: actions/download-artifact@v4
        with:
          name: npm-tarballs
          path: ./tarballs

      - name: Publish each tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN not set — skipping npm publish (tarballs remain on the GitHub Release)"
            exit 0
          fi
          for tgz in tarballs/*.tgz; do
            echo "Publishing $tgz …"
            npm publish "$tgz" --access public
          done

  # ---------------------------------------------------------------------
  # Create the GitHub Release with the final installable artifacts.
  # npm packages are published to the npm registry by the publish-npm
  # job and are not duplicated as release assets.
  # ---------------------------------------------------------------------
  github-release:
    name: GitHub Release
    needs: [build, desktop, binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-assets

      - name: Flatten artifact layout
        run: |
          mkdir -p assets
          find release-assets -type f \( \
            -name "*.vsix" -o -name "*.zip" \
            -o -name "*.dmg" -o -name "*.exe" -o -name "*.AppImage" \
            -o -name "install.sh" -o -name "install.ps1" -o -name "install.cmd" \
            -o -name "codepilot-darwin-*" -o -name "codepilot-linux-*" \
            -o -name "codepilot-win-*" \
            -o -name "codepilot-tui-*" -o -name "codepilot-web-*.tar.gz" \
          \) -exec cp {} assets/ \;
          ls -la assets/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Clean existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo dtssv/CodePilot >/dev/null 2>&1; then
            echo "Deleting existing release $TAG so it can be recreated clean…"
            gh release delete "$TAG" --repo dtssv/CodePilot --yes
          else
            echo "No existing release for $TAG — will create fresh."
          fi

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CodePilot ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          files: |
            assets/*.vsix
            assets/*.zip
            assets/*.dmg
            assets/*.exe
            assets/*.AppImage
            assets/install.sh
            assets/install.ps1
            assets/install.cmd
            assets/codepilot-darwin-*
            assets/codepilot-linux-*
            assets/codepilot-win-*
            assets/codepilot-tui-*
            assets/codepilot-web-*.tar.gz

      - name: Release diagnostics
        if: always()
        run: |
          {
            echo "## Release job state"
            echo "outcome: ${{ steps.release.outcome }}"
            echo "## assets found"
            ls -la assets/ || echo "(no assets dir)"
          } >> "$GITHUB_STEP_SUMMARY"
