# Gradle / JVM options
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Pin the Gradle daemon JVM to a JDK the embedded Kotlin compiler understands *and* that the
# IntelliJ Platform Gradle Plugin (requires JDK 17+) accepts.
# - JDK 17 reports `java.version = 17.0.x` — Kotlin 2.0.x can parse it.
# - JDK 25 reports `java.version = 25.0.3` — Kotlin 2.0.21's `JavaVersion.parse` throws IllegalArgumentException.
# Prefer JAVA_HOME / toolchain auto-download over a machine-local path.
# Do NOT commit org.gradle.java.home here — a macOS /tmp JDK path breaks Linux CI.
# Override locally with: ./gradlew -Dorg.gradle.java.home=/path/to/jdk-17 …
# or put org.gradle.java.home=… in ~/.gradle/gradle.properties.

# Auto-provisioning toolchains via foojay — keeps builds reproducible without a local Java 17 install.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true

# IntelliJ Platform Gradle Plugin (v2.x) configuration knobs
# Plugin path sandbox: https://cache-redirector.jetbrains.com/intellij-dependencies/org/jetbrains/intellij/dependencies/gradle/ideauidescriptor/...
# platformVersion is consumed by `intellijPlatform { intellijIdeaCommunity(...) }` block.

# Kotlin compiler
kotlin.code.style=official
kotlin.incremental=true

# Suppress noisy warnings from transitive IntelliJ / JB libraries
org.gradle.warning.mode=summary