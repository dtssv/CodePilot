<!-- CodePilot activity-bar mark. VSCode renders this monochrome and themes it
     via currentColor, so it is a single-color silhouette of the brand glyph
     (the upward "7i" arrow from design/codepilot-icon-option-b.png): a top bar,
     a diagonal rising stroke, a vertical bar, and the "i" dot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
  <!-- top horizontal bar (slanted parallelogram) -->
  <path d="M4 6 L16 6 L13.5 9 L4 9 Z" />
  <!-- diagonal rising stroke -->
  <path d="M6.5 18.5 L13.5 8 L16.2 9.8 L9.2 20.3 Z" />
  <!-- vertical bar -->
  <path d="M15.5 9.5 L18.5 9.5 L18 20 L15 20 Z" />
  <!-- "i" dot -->
  <circle cx="18.5" cy="5.5" r="1.6" />
</svg>
